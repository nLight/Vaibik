[package]
name = "vibemic-gpui"
version = "0.1.35"
description = "VibeMic universal voice console (GPUI Kit)"
edition = "2021"
rust-version = "1.77"

[dependencies]
gpui-kit = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
arboard = "3"
hidapi = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true