name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'release' && 'pages-release' || 'pages' }}
  cancel-in-progress: false
jobs:
  refresh-after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Request Pages deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Render published download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/vaibik-releases.json"
          cp -R site "$RUNNER_TEMP/vaibik-pages"
          node script/render_pages.mjs "$RUNNER_TEMP/vaibik-releases.json" "$RUNNER_TEMP/vaibik-pages/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/vaibik-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                --jq '.artifacts[] | select(.expired == false) | .id') && [[ -n "$artifact_id" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become visible to the deployment API."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
